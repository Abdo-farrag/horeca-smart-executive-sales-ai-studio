name: One Shot Release QA Fixes

on:
  push:
    branches:
      - fix/release-qa-2026-09-03

permissions:
  contents: write

jobs:
  patch:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/release-qa-2026-09-03
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply approved fixes
        run: python3 scripts/apply-release-qa-fixes.py
      - name: Install dependencies
        run: npm ci || npm install
      - name: Verify contracts
        run: npm run contracts:test
      - name: Verify unit tests
        run: npm run test:unit
      - name: Verify TypeScript
        run: npm run lint
      - name: Verify build
        run: npm run build
      - name: Commit verified fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src apps packages server.ts tests package.json
          git commit -m "fix: close release QA blockers"
          git push origin HEAD:fix/release-qa-2026-09-03

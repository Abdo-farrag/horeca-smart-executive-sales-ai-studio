name: One Shot OTC Event Quality Scope Patch

on:
  push:
    branches:
      - feature/order-to-cash-returns-control

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/order-to-cash-returns-control
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply scoped OTC event quality patch
        run: node scripts/patch-otc-event-quality.mjs
      - name: Verify targeted contract
        run: node tests/business-rules/order-to-cash-returns-control-contract.mjs
      - name: Commit patch
        run: |
          if git diff --quiet; then
            echo "No patch diff found" >&2
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/migrations/20261003020000_otc_secure_rpcs.sql
          git commit -m "fix: scope OTC event link-quality metrics"
          git push origin HEAD:feature/order-to-cash-returns-control

name: One Shot Sales Rep 360 Scope Retention Fix

on:
  push:
    branches:
      - fix/sales-rep-360-scope-retention-2026-09-04
    paths:
      - 'scripts/patch-sales-rep-360-scope-retention.mjs'
      - '.github/workflows/one-shot-sales-rep-360-scope-retention.yml'

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/sales-rep-360-scope-retention-2026-09-04
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Confirm RED regression contract
        run: |
          set +e
          node tests/business-rules/sales-rep-360-scope-retention-contract.mjs
          status=$?
          set -e
          if [ "$status" -eq 0 ]; then
            echo "Contract unexpectedly passed before patch"
            exit 1
          fi
      - name: Apply targeted patch
        run: node scripts/patch-sales-rep-360-scope-retention.mjs
      - name: Verify GREEN regression contract
        run: node tests/business-rules/sales-rep-360-scope-retention-contract.mjs
      - name: Commit targeted fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src apps
          git commit -m "fix: preserve Sales Rep 360 company scope and retention integrity"
          git push origin HEAD:fix/sales-rep-360-scope-retention-2026-09-04

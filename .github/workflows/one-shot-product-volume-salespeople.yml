name: One Shot Product Volume Salespeople Fix

on:
  push:
    branches:
      - fix/product-dashboard-quantity-salespeople-2026-09-05
    paths:
      - 'scripts/patch-product-volume-salespeople.mjs'
      - '.github/workflows/one-shot-product-volume-salespeople.yml'

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/product-dashboard-quantity-salespeople-2026-09-05
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply targeted patch
        run: node scripts/patch-product-volume-salespeople.mjs
      - name: Verify regression contract
        run: node tests/business-rules/product-dashboard-volume-salespeople-contract.mjs
      - name: Commit targeted fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src apps
          git commit -m "fix: map product quantity and salesperson fields from live RPC schema"
          git push origin HEAD:fix/product-dashboard-quantity-salespeople-2026-09-05

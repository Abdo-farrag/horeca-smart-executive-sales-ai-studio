name: One Shot Product 360 Test Diagnostic

on:
  push:
    branches:
      - fix/product-360-rpc-contract-alignment-2026-09-06
    paths:
      - '.github/workflows/one-shot-product-360-test-diagnostic.yml'

permissions:
  contents: write

jobs:
  diagnose:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/product-360-rpc-contract-alignment-2026-09-06
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Capture product test failures
        run: |
          set +e
          node scripts/patch-product-360-rpc-tests.mjs
          npx vitest run src/analytics/__tests__/products.test.ts apps/lovable/src/analytics/__tests__/products.test.ts apps/studio/src/analytics/__tests__/products.test.ts > product-360-test-diagnostic.txt 2>&1
          echo "EXIT_CODE=$?" >> product-360-test-diagnostic.txt
          set -e
      - name: Commit diagnostic output only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add product-360-test-diagnostic.txt
          git commit -m "chore: capture Product 360 unit-test diagnostics"
          git push origin HEAD:fix/product-360-rpc-contract-alignment-2026-09-06
